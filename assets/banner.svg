    <circle r="92" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-dasharray="4 8"/>
    <circle r="56" fill="none" stroke="#f97366" stroke-opacity="0.25" stroke-dasharray="3 7"/>
    <circle r="22" fill="#0b1b33" stroke="#2dd4bf" stroke-width="2"/>
    <text y="6" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">PM</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="92" cy="0" r="9" fill="#2dd4bf"/>
      <circle cx="-46" cy="79.7" r="9" fill="#38bdf8"/>
      <circle cx="-46" cy="-79.7" r="9" fill="#a78bfa"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      <circle cx="56" cy="0" r="6" fill="#f97366"/>
      <circle cx="-56" cy="0" r="6" fill="#fbbf24"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Amir Pournajib, Technical Product Leader: Agentic AI, Connected Health, Hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="1" stop-color="#0f2f45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>
  <text x="70" y="118" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Amir Pournajib</text>
  <text x="72" y="164" fill="#99f6e4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Technical Product Leader</text>
  <text x="72" y="204" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Agentic AI  ·  Connected Health  ·  Hardware</text>
  <text x="72" y="244" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">PMP  ·  M.Sc. Computer Science (AI, Robotics, Computer Vision)  ·  North Vancouver, BC</text>
  <g transform="translate(960 150)">
